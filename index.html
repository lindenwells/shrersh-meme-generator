<!doctype html>
<html style="font-family: Arial, Helvetica, sans-serif">
  <head>
    <meta charset="UTF-8" />
    <title>Shrersh</title>
    <script type="module" src="./script.js"></script>
    <script>
      const updateImagePreview = (firstImage) => {
        if (firstImage) {
          const preview = document.getElementById("uploaded-image-preview");
          while (preview.firstChild) {
            preview.removeChild(preview.firstChild);
          }
          const img = document.createElement("img");
          img.src = URL.createObjectURL(firstImage);
          img.alt = img.title = img.name;
          img.style = "max-width: 30vw;";

          preview.appendChild(img);
        }
      };

      window.addEventListener("load", () => {
        updateImagePreview(window.getFirstImage());
      });
    </script>
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div style="height: 100vh; width: 100vw; display: flex; gap: 1rem">
      <div
        style="
          flex-grow: 1;
          display: flex;
          gap: 0.5rem;
          flex-direction: column;
          max-width: 30vw;
        "
      >
        <label for="image-upload">Upload image</label>
        <input
          id="image-upload"
          type="file"
          accept="image/*"
          onchange="updateImagePreview(getFirstImage())"
        />
        <div style="width: fit-content">
          <div id="uploaded-image-preview" style="width: fit-content"></div>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
            style="width: 100%"
            id="flip-point"
          />
        </div>
        <form id="side">
          <fieldset>
            <legend>Select which side of the picture will be used:</legend>

            <input type="radio" id="left" name="side" value="left" checked />
            <label for="left">Left</label>
            <input type="radio" id="right" name="side" value="right" />
            <label for="right">Right</label>
          </fieldset>
        </form>
      </div>
      <button
        id="shrershify"
        style="background-color: #b6b52a"
        onclick="shrershify(getFirstImage(), getFlipPoint())"
      >
        Shrershify
      </button>
      <div style="display: flex; flex-direction: column">
        <label>Output</label>
        <canvas id="output"></canvas>
      </div>
    </div>
  </body>
</html>
