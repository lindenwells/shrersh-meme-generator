<!doctype html>
<html style="font-family: Arial, Helvetica, sans-serif">
  <head>
    <meta charset="UTF-8" />
    <title>Shrersh</title>
    <script type="module" src="/src/main.ts"></script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    style="
      width: 1280px;
      margin-left: auto;
      margin-right: auto;
      background-color: white;
      border-radius: 4px;
      padding: 8px;
    "
  >
    <div class="flex gap-1-rem">
      <div class="flex flex-col gap-1-rem" style="max-width: 360px">
        <div class="flex">
          <div class="flex flex-col gap-1-rem">
            <label for="image-upload">Upload image</label>
            <input
              id="image-upload"
              type="file"
              accept="image/png, image/jpeg"
              onchange="updateImagePreview(getFirstImage())"
            />
          </div>
          <div class="flex gap-half" style="align-items: flex-end">
            <label for="flip">Flip image</label>
            <input id="flip" type="checkbox" />
          </div>
        </div>
        <div style="width: fit-content">
          <div id="uploaded-image-preview"></div>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
            style="width: 100%"
            id="flip-point"
          />
        </div>

        <button
          id="shrershify"
          style="
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            column-gap: 8px;
            background-color: #b6b52a;
            border-radius: 4px;
            color: #3b271c;
            padding: 4px;
          "
        >
          <img src="/favicon.png" style="height: 32px" />Shrershify
        </button>
      </div>

      <div style="display: flex; flex-direction: column">
        <label>Output</label>
        <canvas id="output"></canvas>
      </div>
    </div>
  </body>
</html>
