<!doctype html>
<html style="font-family: Arial, Helvetica, sans-serif">
  <head>
    <meta charset="UTF-8" />
    <title>Shrersh</title>
    <script type="module" src="/src/main.ts"></script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body style="width: 1280px; margin-left: auto; margin-right: auto">
    <div style="display: flex; gap: 1rem">
      <div
        style="
          flex-grow: 1;
          display: flex;
          gap: 0.5rem;
          flex-direction: column;
          max-width: 30vw;
        "
      >
        <label for="image-upload">Upload image</label>
        <input
          id="image-upload"
          type="file"
          accept="image/png, image/jpeg"
          onchange="updateImagePreview(getFirstImage())"
        />
        <div style="width: fit-content">
          <div id="uploaded-image-preview" style="width: fit-content"></div>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
            style="width: 100%"
            id="flip-point"
          />
        </div>
        <fieldset>
          <legend>Flip to include right side of image:</legend>
          <label for="flip">Flip image</label>
          <input id="flip" type="checkbox" />
        </fieldset>
        <button
          id="shrershify"
          style="
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            column-gap: 8px;
            background-color: #b6b52a;
            padding: 4px;
          "
        >
          <img src="/favicon.png" style="height: 32px" />Shrershify
        </button>
      </div>

      <div style="display: flex; flex-direction: column">
        <label>Output</label>
        <canvas id="output"></canvas>
      </div>
    </div>
  </body>
</html>
